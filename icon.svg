<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark background -->
  <rect width="100" height="100" rx="20" fill="#0f1219"/>
  <!-- Grid lines (subtle) -->
  <line x1="14" y1="72" x2="86" y2="72" stroke="#2e3448" stroke-width="1"/>
  <line x1="14" y1="55" x2="86" y2="55" stroke="#2e3448" stroke-width="1"/>
  <line x1="14" y1="38" x2="86" y2="38" stroke="#2e3448" stroke-width="1"/>
  <!-- Candlestick 1 — red (down) -->
  <line x1="22" y1="60" x2="22" y2="70" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="18" y="62" width="8" height="6" rx="1" fill="#ef4444"/>
  <!-- Candlestick 2 — green (up) -->
  <line x1="36" y1="48" x2="36" y2="68" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="32" y="50" width="8" height="12" rx="1" fill="#22c55e"/>
  <!-- Candlestick 3 — green (up) -->
  <line x1="50" y1="38" x2="50" y2="60" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="46" y="40" width="8" height="14" rx="1" fill="#22c55e"/>
  <!-- Candlestick 4 — red (down) -->
  <line x1="64" y1="36" x2="64" y2="56" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="60" y="40" width="8" height="10" rx="1" fill="#ef4444"/>
  <!-- Candlestick 5 — green (up, tallest) -->
  <line x1="78" y1="26" x2="78" y2="52" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="74" y="28" width="8" height="18" rx="1" fill="#22c55e"/>
  <!-- MA line (indigo) -->
  <polyline points="22,64 36,56 50,47 64,45 78,36"
            fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Signal dot -->
  <circle cx="78" cy="36" r="4" fill="#6366f1"/>
  <circle cx="78" cy="36" r="7" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.5"/>
</svg>
