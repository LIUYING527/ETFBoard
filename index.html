<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ETF信号板">
<meta name="theme-color" content="#0f1219">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>ETF信号板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f1219;--sf:#1a1f2e;--s2:#242938;--s3:#2e3448;
  --tx:#e8eaf0;--t2:#9ba3bc;--t3:#5d6580;
  --gr:#22c55e;--ye:#f59e0b;--re:#ef4444;--bl:#6366f1;--cy:#06b6d4;
  --r:12px;
}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden}
#hdr{background:var(--sf);padding:11px 13px 7px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--s3)}
.h1{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.htit{font-size:17px;font-weight:700}
.hbs{display:flex;gap:5px}
.hb{background:var(--s3);color:var(--t2);border:none;padding:5px 9px;border-radius:7px;font-size:12px;cursor:pointer;white-space:nowrap}
.hb.on{background:var(--bl);color:#fff}
.hb:active{opacity:.7}
.hst{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:4px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--t3);flex-shrink:0}
.dot.live{background:var(--gr);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.prg{font-size:11px;color:var(--bl);margin-left:2px}
#tabs{background:var(--sf);padding:0 13px 9px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--s3)}
.tab{background:transparent;color:var(--t2);border:1px solid var(--s3);padding:3px 10px;border-radius:18px;font-size:12px;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--bl);color:#fff;border-color:var(--bl)}
.ss{margin-left:auto;background:var(--s3);color:var(--t2);border:none;padding:4px 7px;border-radius:6px;font-size:12px;cursor:pointer;outline:none}
#grid{padding:9px;display:grid;grid-template-columns:1fr 1fr;gap:9px;padding-bottom:20px}
@media(min-width:520px){#grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:780px){#grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--sf);border-radius:var(--r);padding:11px 10px 9px;cursor:pointer;border:1px solid var(--s3);position:relative;overflow:hidden;user-select:none;transition:transform .1s}
.card:active{transform:scale(.97)}
.card.cg{border-color:var(--re);background:linear-gradient(135deg,var(--sf) 55%,#ef444414)}
.card.cy{border-color:var(--ye);background:linear-gradient(135deg,var(--sf) 55%,#f59e0b14)}
.card.cr{border-color:var(--gr);background:linear-gradient(135deg,var(--sf) 55%,#22c55e14)}
.csig{position:absolute;top:7px;right:7px;font-size:15px}
.ccode{font-size:9px;color:var(--t3);margin-bottom:1px}
.cname{font-size:12px;font-weight:700;padding-right:18px;margin-bottom:5px;line-height:1.25}
.cpxrow{display:flex;align-items:baseline;gap:5px;margin-bottom:1px;flex-wrap:wrap}
.cpx{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.cchg{font-size:12px;font-weight:600}
.cchg.up{color:var(--re)}.cchg.dn{color:var(--gr)}.cchg.fl{color:var(--t3)}
.crsi{font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;margin-left:auto}
.crsi.ro{background:#ef444420;color:var(--re)}
.crsi.ry{background:#f59e0b20;color:var(--ye)}
.crsi.rg{background:#22c55e20;color:var(--gr)}
.crsi.rb{background:#06b6d420;color:var(--cy)}
.cdiv{height:1px;background:var(--s3);margin:5px 0}
.crow{display:flex;justify-content:space-between;margin-bottom:2px}
.cl{font-size:10px;color:var(--t3)}.cv{font-size:10px;color:var(--t2);font-weight:500}
.cma{font-size:9px;margin:3px 0 2px;display:flex;gap:4px;flex-wrap:wrap}
.mu{color:var(--re)}.md{color:var(--gr)}
/* 资金流向小条 */
.cflow{height:3px;background:var(--s3);border-radius:2px;overflow:hidden;margin:3px 0 2px;display:none}
.cflow.on{display:block}
.cfl-in{height:100%;border-radius:2px;background:var(--re)}
.cbg{height:3px;background:var(--s3);border-radius:2px;overflow:hidden;margin-top:2px}
.cb{height:100%;border-radius:2px;transition:width .5s}
.csc{font-size:10px;font-weight:700;margin-top:2px}
.cerr{font-size:10px;color:var(--t3);text-align:center;padding:4px 0}
.rbtn{background:var(--s3);color:var(--t2);border:none;padding:3px 8px;border-radius:5px;font-size:10px;cursor:pointer;width:100%;margin-top:3px}
.sk{background:linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:3px}
@keyframes sh{0%{background-position:200% 0}to{background-position:-200% 0}}
.skh{height:11px;margin:4px 0}.skp{height:17px;width:60%;margin:5px 0}
/* AI 对话页 */
#aipage{display:none;flex-direction:column;padding:9px 9px 0}
.aichips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px}
.chip{background:var(--s2);border:1px solid var(--s3);color:var(--t2);padding:5px 10px;border-radius:16px;font-size:12px;cursor:pointer;white-space:nowrap}
.chip:active{opacity:.7}
.chip.danger{color:var(--t3)}
#aisnap{font-size:10px;color:var(--t3);margin:0 2px 7px}
#aichat{min-height:40vh;padding-bottom:12px}
#aichat p{margin:3px 0}#aichat h3{color:var(--tx);font-size:14px;margin:10px 0 4px;font-weight:700}
#aichat ul,#aichat ol{padding-left:16px;margin:3px 0}#aichat li{margin:2px 0}#aichat strong{color:var(--tx)}
.aiph{color:var(--t3);text-align:center;padding:30px 10px;font-size:13px;line-height:1.9}
.mrow-u{display:flex;justify-content:flex-end;margin:7px 0}
.mrow-a{display:flex;justify-content:flex-start;margin:7px 0}
.mub{max-width:82%;background:var(--bl);color:#fff;border-radius:14px 14px 4px 14px;padding:8px 12px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.mab{max-width:94%;background:var(--s2);border:1px solid var(--s3);border-radius:4px 14px 14px 14px;padding:9px 12px;font-size:13px;line-height:1.75;color:var(--t2);word-break:break-word}
.aiinput{position:sticky;bottom:0;display:flex;gap:7px;padding:9px 0 12px;background:var(--bg)}
#aitext{flex:1;background:var(--s2);border:1px solid var(--s3);color:var(--tx);border-radius:18px;padding:9px 14px;font-size:13px;outline:none;resize:none;font-family:inherit;line-height:1.4;max-height:90px}
#aitext:focus{border-color:var(--bl)}
#aisend{background:var(--bl);color:#fff;border:none;border-radius:18px;padding:0 16px;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
#aisend.stop{background:var(--re)}
/* 情绪指数胶囊 */
.senti{font-size:10px;font-weight:700;padding:1px 8px;border-radius:9px;margin-left:auto}
/* 机构徽章 */
.ibdg{font-size:9px;padding:0 4px;border-radius:3px;font-weight:600}
.ibdg.up{background:#6366f120;color:var(--bl)}
.ibdg.dn{background:#5d658020;color:var(--t3)}
.ibdg.warn{background:#f59e0b20;color:var(--ye)}
/* Detail Modal */
#det{display:none;position:fixed;inset:0;z-index:300;background:#000b;align-items:flex-end}
#det.show{display:flex}
.dbox{background:var(--sf);border-radius:20px 20px 0 0;width:100%;max-height:88vh;display:flex;flex-direction:column}
.dhdr{padding:13px 15px;border-bottom:1px solid var(--s3);display:flex;align-items:center;gap:10px;flex-shrink:0}
.dname{font-size:16px;font-weight:700;flex:1}
.dx{background:var(--s3);color:var(--t2);border:none;width:29px;height:29px;border-radius:50%;font-size:15px;cursor:pointer}
.dbody{flex:1;overflow-y:auto;padding:13px 15px 28px}
.dpr{display:flex;align-items:baseline;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.dpx{font-size:28px;font-weight:700}.dchg{font-size:15px;font-weight:700}
.damt{font-size:11px;color:var(--t3);margin-left:auto;align-self:center}
canvas#ch{width:100%;height:185px;display:block;background:var(--s2);border-radius:7px;margin-bottom:11px}
.mrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}
.mtag{font-size:11px;padding:3px 8px;border-radius:5px;font-weight:600}
.mtag.ab{background:#ef444420;color:var(--re)}.mtag.bel{background:#22c55e20;color:var(--gr)}
/* Section title */
.dsect{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;margin:13px 0 7px;display:flex;align-items:center;gap:5px}
.dsect::after{content:'';flex:1;height:1px;background:var(--s3)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mgrid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mc{background:var(--s2);border-radius:7px;padding:9px 6px;text-align:center}
.ml{font-size:9px;color:var(--t3);margin-bottom:3px}.mv{font-size:13px;font-weight:700}
/* RSI Gauge */
.rsi-wrap{background:var(--s2);border-radius:7px;padding:10px 11px;margin-bottom:9px}
.rsi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rsi-val{font-size:18px;font-weight:700}
.rsi-label{font-size:11px;color:var(--t3)}
.rsi-track{height:6px;border-radius:3px;background:linear-gradient(to right,#06b6d4 0%,#06b6d4 30%,#22c55e 30%,#22c55e 45%,#6366f1 45%,#6366f1 65%,#f59e0b 65%,#f59e0b 75%,#ef4444 75%,#ef4444 100%);position:relative}
.rsi-needle{position:absolute;top:-3px;width:2px;height:12px;background:#fff;border-radius:1px;transform:translateX(-50%)}
.rsi-zones{display:flex;justify-content:space-between;font-size:9px;color:var(--t3);margin-top:3px}
/* MACD mini chart */
.macd-wrap{background:var(--s2);border-radius:7px;padding:10px 11px;margin-bottom:9px}
.macd-top{display:flex;justify-content:space-between;margin-bottom:6px}
.macd-sig{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px}
.macd-bull{background:#22c55e20;color:var(--gr)}.macd-bear{background:#ef444420;color:var(--re)}.macd-neut{background:var(--s3);color:var(--t3)}
.macd-vals{font-size:10px;color:var(--t3)}
canvas#macd-cv{width:100%;height:40px;display:block}
/* 资金流向 */
.flow-sect{background:var(--s2);border-radius:7px;padding:10px 11px;margin-bottom:9px}
.flow-title{font-size:11px;color:var(--t3);margin-bottom:8px}
.flow-bar-wrap{height:16px;border-radius:8px;overflow:hidden;display:flex;margin-bottom:5px}
.flow-in{background:var(--re);display:flex;align-items:center;justify-content:flex-start;padding-left:6px;font-size:10px;color:#fff;font-weight:700;min-width:0;transition:width .5s}
.flow-out{background:var(--gr);display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:10px;color:#fff;font-weight:700;min-width:0;transition:width .5s}
.flow-stats{display:flex;justify-content:space-between;font-size:10px;color:var(--t3)}
.flow-na{font-size:11px;color:var(--t3);text-align:center;padding:4px 0}
/* KDJ */
.kdj-wrap{display:flex;gap:6px;margin-bottom:9px}
.kdj-item{flex:1;background:var(--s2);border-radius:7px;padding:8px 6px;text-align:center}
/* Score breakdown */
#scoreExp{margin-top:13px;background:var(--s2);border-radius:8px;padding:11px 12px;font-size:12px;line-height:1.8;color:var(--t2)}
/* Settings */
#cfg,#posm{display:none;position:fixed;inset:0;z-index:500;background:#000b;overflow-y:auto}
#cfg.show,#posm.show{display:flex}
.cbox{background:var(--sf);border-radius:var(--r);padding:17px;width:min(88vw,370px);border:1px solid var(--s3);max-height:82vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:auto}
.ctit{font-size:15px;font-weight:700;margin-bottom:13px}
.clbl{font-size:12px;color:var(--t2);margin-bottom:5px;display:block}
.cinp{width:100%;background:var(--s2);border:1px solid var(--s3);color:var(--tx);padding:9px 11px;border-radius:7px;font-size:13px;outline:none;margin-bottom:11px}
.cinp:focus{border-color:var(--bl)}
.cbtns{display:flex;gap:9px;justify-content:flex-end}
.bcc{background:var(--s3);color:var(--t2);border:none;padding:7px 13px;border-radius:7px;cursor:pointer;font-size:13px}
.bcs{background:var(--bl);color:#fff;border:none;padding:7px 13px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1e293b;color:var(--t2);padding:7px 13px;border-radius:18px;font-size:12px;z-index:600;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center;border:1px solid var(--s3)}
#toast.on{opacity:1}
.prdel{background:none;border:none;color:var(--t3);font-size:14px;cursor:pointer;padding:2px 5px}
#top{position:fixed;bottom:62px;right:13px;z-index:150;background:var(--bl);color:#fff;border:none;width:37px;height:37px;border-radius:50%;font-size:17px;cursor:pointer;display:none;align-items:center;justify-content:center}
#top.on{display:flex}
/* 持仓 */
#possum{display:none;padding:9px 9px 0}
.pempty{background:var(--sf);border:1px dashed var(--s3);border-radius:var(--r);padding:14px;text-align:center;font-size:12px;color:var(--t3);line-height:1.7}
.psum{background:linear-gradient(135deg,var(--sf),#6366f114);border:1px solid var(--s3);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.psitem{text-align:center}.psl{font-size:10px;color:var(--t3);margin-bottom:2px}.psv{font-size:13px;font-weight:700}
.dcard{background:var(--s2);border:1px solid var(--s3);border-radius:9px;padding:10px 11px;margin-bottom:11px}
.pcrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.pl{font-size:11px;color:var(--t3)}.pv{font-size:12px;font-weight:600;color:var(--tx)}
.pbtns{display:flex;gap:7px;margin-top:7px}
.pbtn{flex:1;background:var(--s3);color:var(--t2);border:none;padding:7px;border-radius:7px;font-size:12px;cursor:pointer}
.pbtn:active{opacity:.7}
.pbtn.ai{background:var(--bl);color:#fff;font-weight:600}
.padd{width:100%;background:transparent;border:1px dashed var(--s3);color:var(--t3);padding:9px;border-radius:9px;font-size:12px;cursor:pointer;margin-bottom:11px}
.prow{display:flex;align-items:center;gap:7px;background:var(--s2);border-radius:8px;padding:8px 10px;margin-bottom:7px;cursor:pointer}
.prname{font-size:12px;font-weight:600}
.prsub{font-size:10px;color:var(--t3);margin-top:1px}
</style>
</head>
<body>
<div id="hdr">
  <div class="h1">
    <div class="htit">📊 ETF信号板</div>
    <div class="hbs">
      <button class="hb" id="rfb" onclick="loadAll(true)">↻ 刷新</button>
      <button class="hb" onclick="setF('__ai')">🤖 AI</button>
      <button class="hb" onclick="openPos()">💼</button>
      <button class="hb" onclick="openCfg()">⚙️</button>
    </div>
  </div>
  <div class="hst">
    <div class="dot" id="dot"></div>
    <span id="stxt">初始化…</span>
    <span class="prg" id="prg"></span>
    <span class="senti" id="senti" style="display:none"></span>
  </div>
</div>
<div id="tabs">
  <button class="tab on" onclick="setF('all')">全部</button>
  <button class="tab" onclick="setF('宽基')">宽基</button>
  <button class="tab" onclick="setF('科技')">科技🔥</button>
  <button class="tab" onclick="setF('能源')">能源⚡</button>
  <button class="tab" onclick="setF('行业')">行业</button>
  <button class="tab" onclick="setF('商品债')">商品债</button>
  <button class="tab" onclick="setF('持仓')">💼持仓</button>
  <button class="tab" onclick="setF('__ai')">🤖AI</button>
  <select class="ss" id="ss" onchange="renderGrid()">
    <option value="score">按得分</option>
    <option value="mom">按动量</option>
    <option value="chg">按涨幅</option>
    <option value="rsi">按RSI</option>
    <option value="name">按名称</option>
  </select>
</div>
<div id="possum"></div>
<div id="grid"></div>
<div id="aipage">
  <div class="aichips">
    <button class="chip" onclick="ETFAI.quick('scan')">📊 全市场扫描</button>
    <button class="chip" onclick="ETFAI.quick('pos')">💼 持仓诊断</button>
    <button class="chip" onclick="ETFAI.quick('risk')">⚠️ 风险排查</button>
    <button class="chip" onclick="ETFAI.quick('rotate')">🔄 轮动方向</button>
    <button class="chip danger" onclick="ETFAI.clear()">🗑 清空</button>
  </div>
  <div id="aisnap"></div>
  <div id="aichat"></div>
  <div class="aiinput">
    <textarea id="aitext" rows="1" placeholder="问我：通信ETF主力在流入，能补吗？"></textarea>
    <button id="aisend" onclick="ETFAI.sendInput()">发送</button>
  </div>
</div>
<div id="det" onclick="if(event.target===this)closeDet()">
  <div class="dbox">
    <div class="dhdr">
      <div><div style="font-size:10px;color:var(--t3)" id="dcode"></div><div class="dname" id="dname"></div></div>
      <div id="dsig" style="font-size:22px"></div>
      <button class="dx" onclick="closeDet()">✕</button>
    </div>
    <div class="dbody">
      <div class="dpr">
        <span class="dpx" id="dpx">—</span>
        <span class="dchg" id="dchg"></span>
        <span class="damt" id="damt"></span>
      </div>
      <div id="dpos"></div>
      <canvas id="ch"></canvas>
      <div class="mrow" id="mtags"></div>
      <!-- RSI -->
      <div class="dsect">RSI · 相对强弱</div>
      <div class="rsi-wrap" id="rsi-wrap">
        <div class="rsi-top">
          <div>
            <div class="rsi-val" id="rsi-val">—</div>
            <div class="rsi-label" id="rsi-label">RSI(14)</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:11px;font-weight:600" id="rsi-zone">—</div>
            <div style="font-size:10px;color:var(--t3)" id="rsi-desc">—</div>
          </div>
        </div>
        <div class="rsi-track"><div class="rsi-needle" id="rsi-needle" style="left:50%"></div></div>
        <div class="rsi-zones"><span>0 超卖</span><span>30</span><span>50</span><span>70</span><span>超买 100</span></div>
      </div>
      <!-- MACD -->
      <div class="dsect">MACD · 趋势动量</div>
      <div class="macd-wrap" id="macd-wrap">
        <div class="macd-top">
          <div>
            <div id="macd-sig-badge" class="macd-sig macd-neut">—</div>
            <div class="macd-vals" id="macd-vals" style="margin-top:4px">—</div>
          </div>
          <div style="text-align:right;font-size:10px;color:var(--t3)" id="macd-desc">—</div>
        </div>
        <canvas id="macd-cv"></canvas>
      </div>
      <!-- 技术指标网格 -->
      <div class="dsect">技术指标</div>
      <div class="mgrid4" id="techgrid"></div>
      <!-- 量化因子 -->
      <div class="dsect">量化因子 · 趋势/波动/相对强弱</div>
      <div class="mgrid4" id="quantgrid"></div>
      <!-- 机构动向 -->
      <div class="dsect">机构动向 · 申赎/折溢价/VWAP</div>
      <div class="mgrid4" id="instgrid"></div>
      <div id="instnote" style="font-size:10px;color:var(--t3);line-height:1.6;margin-top:2px"></div>
      <!-- 支撑阻力 -->
      <div class="dsect">关键价位 · 支撑/阻力</div>
      <div id="srrow" style="font-size:12px;line-height:1.9;color:var(--t2)"></div>
      <!-- 资金流向 -->
      <div class="dsect">资金流向 · 主力/内外盘</div>
      <div id="mainflow"></div>
      <div class="flow-sect" id="flow-sect">

// ── 指标计算 ─────────────────────────────────────────────────────────────

// RSI(14) - Wilder平滑法
function calcRSI(closes, period=14){
  if(!closes||closes.length<period+1)return null;
  let ag=0,al=0;
  for(let i=closes.length-period;i<closes.length;i++){
    const d=closes[i]-closes[i-1];
    if(d>0)ag+=d; else al-=d;
  }
  ag/=period;al/=period;
  if(al===0)return 100;
  return 100-100/(1+ag/al);
}

// EMA
function calcEMA(arr, period){
  if(!arr||arr.length<period)return null;
  const k=2/(period+1);
  let ema=arr.slice(0,period).reduce((a,b)=>a+b,0)/period;
  for(let i=period;i<arr.length;i++)ema=arr[i]*k+ema*(1-k);
  return ema;
}

// MACD(12,26,9) 返回{dif,dea,hist,histPrev,difArr,histArr}用于画图
function calcMACD(closes){
  if(!closes||closes.length<35)return null;
  const k12=2/13,k26=2/27,k9=2/10;
  let ema12=closes[0],ema26=closes[0];
  const difs=[];
  for(let i=1;i<closes.length;i++){
    ema12=closes[i]*k12+ema12*(1-k12);
    ema26=closes[i]*k26+ema26*(1-k26);
    if(i>=25)difs.push(ema12-ema26);
  }
  let dea=difs[0];
  const hists=[];
  for(let i=1;i<difs.length;i++){
    dea=difs[i]*k9+dea*(1-k9);
    hists.push(difs[i]-dea);
  }
  const dif=difs[difs.length-1];
  return{
    dif,dea,
    hist:hists[hists.length-1],
    histPrev:hists.length>=2?hists[hists.length-2]:0,
    histArr:hists.slice(-60),    // 最近60根柱
    difArr:difs.slice(-60),
  };
}

// Bollinger Bands(20,2σ)
function calcBB(closes, period=20, mult=2){
  if(!closes||closes.length<period)return null;
  const sl=closes.slice(-period);
  const mean=sl.reduce((a,b)=>a+b,0)/period;
  const std=Math.sqrt(sl.reduce((a,b)=>a+(b-mean)**2,0)/period);
  const upper=mean+mult*std,lower=mean-mult*std;
  const last=closes[closes.length-1];
  const pctB=(upper===lower)?0.5:(last-lower)/(upper-lower);
  return{upper,middle:mean,lower,pctB,bandwidth:(upper-lower)/mean*100};
}

// KDJ(9,3,3) — 需要高低数据
function calcKDJ(closes, highs, lows, period=9){
  if(!closes||!highs||!lows||closes.length<period)return null;
  let k=50,d=50;
  for(let i=period-1;i<closes.length;i++){
    const hh=Math.max(...highs.slice(i-period+1,i+1));
    const ll=Math.min(...lows.slice(i-period+1,i+1));
    const rsv=hh===ll?50:(closes[i]-ll)/(hh-ll)*100;
    k=2/3*k+1/3*rsv;
    d=2/3*d+1/3*k;
  }
  return{k,d,j:3*k-2*d};
}

// 布林带滚动序列（用于图表绘制）
function rollingBB(closes, n=120, per=20, mult=2){
  const sl=closes.slice(-n);
  return sl.map((_,i)=>{
    if(i<per-1)return null;
    const win=sl.slice(i-per+1,i+1);
    const mean=win.reduce((a,b)=>a+b,0)/per;
    const std=Math.sqrt(win.reduce((a,b)=>a+(b-mean)**2,0)/per);
    return{upper:mean+mult*std,lower:mean-mult*std};
  });
}

// ADX(14) 趋势强度 - Wilder平滑（>25趋势强，+DI/-DI判方向）
function calcADX(h,l,c,per=14){
  if(!h||!l||!c||h.length<per*2+1)return null;
  const trs=[],pdms=[],ndms=[];
  for(let i=1;i<h.length;i++){
    trs.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));
    const up=h[i]-h[i-1],dn=l[i-1]-l[i];
    pdms.push(up>dn&&up>0?up:0);
    ndms.push(dn>up&&dn>0?dn:0);
  }
  let tr=trs.slice(0,per).reduce((a,b)=>a+b,0),
      pdm=pdms.slice(0,per).reduce((a,b)=>a+b,0),
      ndm=ndms.slice(0,per).reduce((a,b)=>a+b,0);
  const dxs=[];let pdi=0,ndi=0;
  for(let i=per;i<trs.length;i++){
    tr=tr-tr/per+trs[i];pdm=pdm-pdm/per+pdms[i];ndm=ndm-ndm/per+ndms[i];
    pdi=tr>0?pdm/tr*100:0;ndi=tr>0?ndm/tr*100:0;
    dxs.push(pdi+ndi>0?Math.abs(pdi-ndi)/(pdi+ndi)*100:0);
  }
  if(dxs.length<per)return null;
  let adx=dxs.slice(0,per).reduce((a,b)=>a+b,0)/per;
  for(let i=per;i<dxs.length;i++)adx=(adx*(per-1)+dxs[i])/per;
  return{adx,pdi,ndi};
}

// ATR(14) - 真实波幅，用于止损/仓位
function calcATR(h,l,c,per=14){
  if(!h||!l||!c||h.length<per+1)return null;
  const trs=[];
  for(let i=1;i<h.length;i++)trs.push(Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])));
  let atr=trs.slice(0,per).reduce((a,b)=>a+b,0)/per;
  for(let i=per;i<trs.length;i++)atr=(atr*(per-1)+trs[i])/per;
  return atr;
}

// OBV 量价关系：返回5日斜率与背离信号
function calcOBV(c,v){
  if(!c||!v||c.length<26||v.length<26)return null;
  let obv=0;const arr=[0];
  for(let i=1;i<c.length;i++){obv+=c[i]>c[i-1]?v[i]:c[i]<c[i-1]?-v[i]:0;arr.push(obv);}
  const n=arr.length;
  const slope5=arr[n-1]-arr[n-6];
  const last=c[c.length-1];
  const win=c.slice(-20);
  let div=null;
  if(last>=Math.max(...win)*0.999&&slope5<0)div='顶背离';
  else if(last<=Math.min(...win)*1.001&&slope5>0)div='底背离';
  return{slope5,div};
}

// Beta(60日) vs 沪深300：>1 波动大于大盘
function calcBeta(c,ic,n=60){
  if(!c||!ic||c.length<n+1||ic.length<n+1)return null;
  const r1=[],r2=[];
  for(let i=c.length-n;i<c.length;i++)r1.push(c[i]/c[i-1]-1);
  for(let i=ic.length-n;i<ic.length;i++)r2.push(ic[i]/ic[i-1]-1);
  const m1=r1.reduce((a,b)=>a+b,0)/n,m2=r2.reduce((a,b)=>a+b,0)/n;
  let cov=0,vv=0;
  for(let i=0;i<n;i++){cov+=(r1[i]-m1)*(r2[i]-m2);vv+=(r2[i]-m2)**2;}
  return vv>0?cov/vv:null;
}

// 年化波动率
function calcVol(c,n){
  if(!c||c.length<n+1)return null;
  const rets=[];for(let i=c.length-n;i<c.length;i++)rets.push(Math.log(c[i]/c[i-1]));
  const mean=rets.reduce((a,b)=>a+b,0)/rets.length;
  return Math.sqrt(rets.reduce((a,r)=>a+(r-mean)**2,0)/rets.length)*Math.sqrt(252)*100;
}

function loadScript(url,charset='UTF-8',timeout=15000){
  return new Promise((resolve,reject)=>{

    const tid=setTimeout(()=>{s.remove();reject(new Error('timeout'));},timeout);
    s.onload=()=>{clearTimeout(tid);s.remove();resolve();};
    s.onerror=()=>{clearTimeout(tid);s.remove();reject(new Error('load error'));};
    s.src=url;
    document.head.appendChild(s);
  });
}

// ETF: p[3]=现价 p[4]=昨收 p[5]=今开 p[7]=外盘 p[8]=内盘 p[32]=涨跌幅%
//      p[33]=最高 p[34]=最低 p[37]=成交额(万) p[38]=换手率%
//      p[61]=='ETF'标记；份额/折溢价/IOPV 位置会漂移 → 用值特征识别（见下）
async function fetchRT(){
  const codes=[...ETFS.map(e=>e.tq),...IDXS.map(i=>i.tq)].join(',');
  try{
    await loadScript(`https://qt.gtimg.cn/q=${codes}`,'GBK',10000);

    IDXS.forEach(i=>{
      const raw=window['v_'+i.tq];
      if(!raw)return;
      delete window['v_'+i.tq];
      const p=raw.split('~');
      const price=parseFloat(p[3]),chg=parseFloat(p[32]),amt=parseFloat(p[37]);
      if(price>0)MKT.q[i.tq]={price,chg:isNaN(chg)?null:chg,amt:isNaN(amt)?null:amt*1e4,hi:parseFloat(p[33])||null,lo:parseFloat(p[34])||null};
    });
    // 两市成交额 = 上证 + 深成（元）
    const a1=MKT.q['sh000001']?.amt,a2=MKT.q['sz399001']?.amt;
    if(a1&&a2)MKT.amtToday=a1+a2;
    // ETF
    ETFS.forEach(e=>{
      const raw=window['v_'+e.tq];
      if(!raw)return;
      delete window['v_'+e.tq];
      const p=raw.split('~');
      const price=parseFloat(p[3]);
      const chgPct=parseFloat(p[32]);
      if(!isNaN(price)&&price>0){
        if(!D[e.code])D[e.code]={};
        const d=D[e.code];
        d.price=price;
        if(!isNaN(chgPct))d.chg=chgPct;
        if(d.closes?.length)d.closes[d.closes.length-1]=price;
        const op=parseFloat(p[5]);
        if(op>0)d.open=op;
        const outV=parseInt(p[7]),inV=parseInt(p[8]);
        if(outV>=0&&inV>=0&&outV+inV>0){d.outVol=outV;d.inVol=inV;}
        const amt=parseFloat(p[37]);
        if(amt>0)d.amount=amt*1e4;             // 万 → 元
        const tv=parseFloat(p[38]);
        if(tv>0&&tv<100)d.turnover=tv;
        const hi=parseFloat(p[33]),lo=parseFloat(p[34]);
        if(hi>0&&lo>0&&hi>=lo&&hi<=price*1.25&&lo>=price*0.75){d.hi=hi;d.lo=lo;}
        // ETF专属：份额/折溢价/IOPV（字段位置会漂移，用值特征稳健识别）
        if(p[61]==='ETF'){
          const tail=p.slice(62),cnt={};
          // 份额 = 尾部出现≥2次的大数（>500万）
          tail.forEach(v=>{const nv=parseFloat(v);if(nv>5e6&&Number.isFinite(nv))cnt[v]=(cnt[v]||0)+1;});
          const shk=Object.keys(cnt).find(k=>cnt[k]>=2);
          if(shk){const sh=parseFloat(shk);if(sh>0)d.shares=sh;}
          // IOPV = 尾部第一个与现价偏差<1%的正数 → 折溢价自算
          const io=tail.map(v=>parseFloat(v)).find(nv=>nv>0&&Math.abs(nv/price-1)<0.01);
          if(io){d.iopv=io;d.prem=(price-io)/io*100;}
        }
        FAIL.delete(e.code);n++;
      }
    });
    snapShares();snapMktAmt();
    return n;
  }catch(e){return 0;}
}

  else arr.push({d:td,s:cur});
  _snapSave('etfShares',arr,45);
  // 计算份额变化（与最近一个不同交易日 / 5个交易日前对比）
  ETFS.forEach(e=>{
    const d=D[e.code];if(!d?.shares)return;
    const prev=[...arr].reverse().find(x=>x.d!==td);
    if(prev?.s[e.code])d.sharesChg1=(d.shares-prev.s[e.code])/prev.s[e.code]*100;
    const p5=arr.length>=6?arr[arr.length-6]:null;
    if(p5?.s[e.code]&&p5.d!==td)d.sharesChg5=(d.shares-p5.s[e.code])/p5.s[e.code]*100;
  });
}

// ── 东财主力资金（经代理，可选）──────────────────────────────────────────
// d.flow = {main:主力净额(元), mainPct:主力净占比%, sup:超大单, big:大单, mid:中单, sml:小单}
async function fetchFlow(){
  const proxy=localStorage.getItem('emProxy');
  if(!proxy)return 0;
  const secids=ETFS.map(e=>(e.tq.startsWith('sh')?'1.':'0.')+e.code).join(',');
  const target=`https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&secids=${secids}&fields=f12,f62,f184,f66,f72,f78,f84`;
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),12000);
    const resp=await fetch(proxy+encodeURIComponent(target),{signal:ctrl.signal});
    clearTimeout(tid);
    if(!resp.ok)return 0;
    const js=await resp.json();
    const rows=js?.data?.diff||[];
    let n=0;
    rows.forEach(r=>{
      const d=D[r.f12];if(!d)return;
      d.flow={main:r.f62??null,mainPct:r.f184??null,sup:r.f66??null,big:r.f72??null,mid:r.f78??null,sml:r.f84??null};
      n++;
    });
    if(n)snapFlow();
    return n;
  }catch(e){return 0;}
}
function snapFlow(){
  const cur={};
  ETFS.forEach(e=>{const m=D[e.code]?.flow?.main;if(m!=null)cur[e.code]=m;});
  if(!Object.keys(cur).length)return;
  const arr=_snapLoad('emFlow'),td=_today();
  if(arr.length&&arr[arr.length-1].d===td)arr[arr.length-1].s=cur;
  else arr.push({d:td,s:cur});

  ETFS.forEach(e=>{
    const d=D[e.code];if(d?.flow?.main==null)return;
    const p5=arr.filter(x=>x.d!==td).slice(-5);
    if(p5.length>=2)d.flow5=p5.reduce((a,x)=>a+(x.s[e.code]||0),0);
  });
}

// ── 分时 VWAP（持仓 + 详情页按需）────────────────────────────────────────
// d.min = {vwap, dev:现价偏离%, tailPct:尾盘30分钟量占比, t:时间戳}
async function fetchMinute(code){
  const e=ETFS.find(x=>x.code===code);if(!e)return;
  const vn='_m'+code;
  try{
    await loadScript(`https://web.ifzq.gtimg.cn/appstock/app/minute/query?_var=${vn}&code=${e.tq}`,'UTF-8',8000);
    const rows=window[vn]?.data?.[e.tq]?.data?.data;
    delete window[vn];
    if(!rows?.length)return;
    const last=rows[rows.length-1].split(' ');
    const cumV=parseFloat(last[2]),cumA=parseFloat(last[3]);
    if(!(cumV>0&&cumA>0))return;
    const vwap=cumA/cumV/100;
    const px=D[code]?.price;
    let tailPct=null;
    const i1430=rows.findIndex(r=>r.startsWith('1430'));
    if(i1430>0){
      const v1430=parseFloat(rows[i1430].split(' ')[2]);
      if(v1430>0&&cumV>v1430)tailPct=(cumV-v1430)/cumV*100;
    }
    D[code].min={vwap,dev:px?(px-vwap)/vwap*100:null,tailPct,t:Date.now()};
  }catch(e){}
}

// ── 历史OHLCV ─────────────────────────────────────────────────────────────
// 腾讯K线格式：day[i]=[日期,开,收,高,低,量(手),额]
function extractOHLCV(data, tq){
  const etfData=data?.data?.[tq]||{};
  const days=etfData.qfqday||etfData.day||[];
  return days.map(d=>{
    const close=parseFloat(d[2]);
    if(isNaN(close)||close<=0)return null;
    return{
      close,
      open:parseFloat(d[1])||close,
      high:parseFloat(d[3])||close,
      low:parseFloat(d[4])||close,
      vol:parseFloat(d[5])||0,
      amt:parseFloat(d[6])||0,     // ETF有成交额字段，指数无
    };
  }).filter(Boolean);
}

async function fetchKline(etf){
  const vn='_h'+etf.code;
  try{
    await loadScript(
      `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?_var=${vn}&param=${etf.tq},day,,,300,`,
      'UTF-8',14000
    );
    let bars=extractOHLCV(window[vn],etf.tq);
    delete window[vn];
    if(!bars.length){
      await loadScript(
        `https://web.ifzq.gtimg.cn/appstock/app/newfqkline/get?_var=${vn}&param=${etf.tq},day,,,300,`,
        'UTF-8',14000
      );
      bars=extractOHLCV(window[vn],etf.tq);
      delete window[vn];
    }
    if(!bars.length){FAIL.add(etf.code);return;}
    if(!D[etf.code])D[etf.code]={};
    const d=D[etf.code];
    d.closes=bars.map(b=>b.close);
    d.highs=bars.map(b=>b.high);
    d.lows=bars.map(b=>b.low);
    d.volumes=bars.map(b=>b.vol);
    d.amts=bars.some(b=>b.amt>0)?bars.map(b=>b.amt):null;
    if(!d.price)d.price=d.closes[d.closes.length-1];
    if(d.chg==null&&d.closes.length>=2){
      const pv=d.closes[d.closes.length-2];
      d.chg=(d.closes[d.closes.length-1]-pv)/pv*100;
    }
    FAIL.delete(etf.code);
  }catch(e){FAIL.add(etf.code);}
}

// ── 指数日K（沪深300=基准/Beta，上证+深成=量能）──────────────────────────
async function fetchIdxKlines(){
  const jobs=[['sh000300','k300'],['sh000001','kSH'],['sz399001','kSZ']].map(async([tq,key])=>{
    const vn='_i'+tq;
    try{
      await loadScript(`https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?_var=${vn}&param=${tq},day,,,300,`,'UTF-8',12000);
      const bars=extractOHLCV(window[vn],tq);
      delete window[vn];
      if(bars.length)MKT[key]={closes:bars.map(b=>b.close),highs:bars.map(b=>b.high),lows:bars.map(b=>b.low),vols:bars.map(b=>b.vol)};
    }catch(e){}
  });
  await Promise.all(jobs);
  // 量能比：上证+深成 5日均量 / 20日均量
  if(MKT.kSH&&MKT.kSZ){
    const v5=(mav(MKT.kSH.vols.slice(0,-1),5)||0)+(mav(MKT.kSZ.vols.slice(0,-1),5)||0);
    const v20=(mav(MKT.kSH.vols.slice(0,-1),20)||0)+(mav(MKT.kSZ.vols.slice(0,-1),20)||0);
    if(v20>0)MKT.volRatio=v5/v20;
  }
}

async function retryOne(code){

// ── 指标计算 & 评分 v2 ────────────────────────────────────────────────────
// 七维：趋势25 + 动量15 + RSI15 + MACD10 + 内外盘10 + 量能10 + 资金动向15 = 100
function compute(){
  const ic=MKT.k300?.closes;
  const idxMom20=ic?.length>=21?(ic[ic.length-1]-ic[ic.length-21])/ic[ic.length-21]*100:null;
  for(const e of ETFS){
    const d=D[e.code];
    if(!d?.closes?.length||d.closes.length<21)continue;
    const c=d.closes,last=c[c.length-1];
    // 均线
    d.ma20=mav(c,20);d.ma50=mav(c,50);d.ma250=mav(c,250);
    // 动量
    d.mom20=c.length>=21?(last-c[c.length-21])/c[c.length-21]*100:null;
    d.mom5 =c.length>=6 ?(last-c[c.length-6]) /c[c.length-6] *100:null;
    // 相对强度（超额收益）
    d.rs20=(d.mom20!=null&&idxMom20!=null)?d.mom20-idxMom20:null;
    // ① 趋势得分(max 25)：MA + ADX
    let ts=0;
    if(d.ma20&&last>d.ma20)ts+=8;
    if(d.ma50&&last>d.ma50)ts+=7;
    if(d.ma250&&last>d.ma250)ts+=5;
    d.adx=d.highs&&d.lows?calcADX(d.highs,d.lows,c):null;
    if(d.adx&&d.adx.adx>20&&d.adx.pdi>d.adx.ndi)ts+=5;
    d.maScore=ts;d.score=null;
    // 250日高低
    const win=c.slice(-250);
    d.high250=Math.max(...win);d.low250=Math.min(...win);
    // 波动率：20日 + 60日比
    d.vol20=calcVol(c,20);
    d.vol60=calcVol(c,60);
    d.volR=(d.vol20&&d.vol60&&d.vol60>0)?d.vol20/d.vol60:null;
    // ATR / BIAS / OBV / Beta
    d.atr=d.highs&&d.lows?calcATR(d.highs,d.lows,c):null;
    d.bias20=(d.ma20&&d.ma20>0)?(last-d.ma20)/d.ma20*100:null;
    d.obv=d.volumes?calcOBV(c,d.volumes):null;
    d.beta=ic?calcBeta(c,ic):null;
    // RSI
    d.rsi=calcRSI(c,14);
    // MACD
    d.macd=calcMACD(c);
    // Bollinger
    d.bb=calcBB(c);
    // KDJ
    if(d.highs&&d.lows)d.kdj=calcKDJ(c,d.highs,d.lows);
    // 量比 & 量能温度（额5/20日均，缺额用量）
    if(d.volumes&&d.volumes.length>=6){
      const avg5=mav(d.volumes.slice(0,-1),5);
      d.volRatio=avg5>0?d.volumes[d.volumes.length-1]/avg5:null;
    }
    const src=d.amts||d.volumes;
    if(src&&src.length>=21){
      const a5=mav(src.slice(-6,-1),5),a20=mav(src.slice(-21,-1),20);
      d.volT=(a5&&a20>0)?a5/a20:null;
    }else d.volT=null;
    // ③ RSI得分(max 15)
    let rsiS=0;
    if(d.rsi!=null){
      const r=d.rsi;
      if(r>=45&&r<=65)rsiS=15;
      else if((r>=35&&r<45)||(r>65&&r<=72))rsiS=9;
      else if(r<35)rsiS=6;
      else if(r<=80)rsiS=3;
      else rsiS=0;
    }
    d.rsiScore=rsiS;
    // ④ MACD得分(max 10)
    let macdS=0;
    if(d.macd){
      const{dif,dea,hist,histPrev}=d.macd;
      if(dif>dea){
        if(hist>0&&hist>histPrev)macdS=10;
        else if(hist>0)macdS=7;
        else macdS=4;
      }else{
        if(hist>histPrev)macdS=3;
        else macdS=0;
      }
    }
    d.macdScore=macdS;
  }

  // ② 动量排名 → momScore(max 15)
  const ranked=ETFS.filter(e=>D[e.code]?.mom20!=null).sort((a,b)=>D[b.code].mom20-D[a.code].mom20);
  ranked.forEach((e,i)=>{
    const d=D[e.code];
    d.momScore=Math.round((1-i/Math.max(ranked.length-1,1))*15);
    d.rank=i+1;
  });
  ETFS.forEach(e=>{const d=D[e.code];if(d&&!d.momScore)d.momScore=0;});

  for(const e of ETFS){
    const d=D[e.code];if(!d)continue;
    // ⑤ 内外盘得分(max 10)
    let flowS=0;
    if(d.outVol!=null&&d.inVol!=null){
      const tot=d.outVol+d.inVol;
      if(tot>0){
        const r=d.outVol/tot;
        if(r>0.60)flowS=10;
        else if(r>0.55)flowS=7;
        else if(r>0.50)flowS=4;
      }
    }
    d.flowScore=flowS;
    // ⑥ 量能得分(max 10)：量比 + 量能温度
    let volS=0;
    if(d.volRatio!=null){
      if(d.volRatio>2)volS+=6;else if(d.volRatio>1.3)volS+=4;else if(d.volRatio>0.8)volS+=2;
    }
    if(d.volT!=null){
      if(d.volT>1.2)volS+=4;else if(d.volT>1.0)volS+=2;
    }
    d.volScore=volS;
    // ⑦ 资金动向得分(max 15)：主力净占比8 + 份额4 + 折溢价2 + VWAP1
    let instS=0;
    if(d.flow?.mainPct!=null){
      const m=d.flow.mainPct;
      if(m>8)instS+=8;else if(m>3)instS+=6;else if(m>0)instS+=4;else if(m>-3)instS+=2;
    }
    if(d.sharesChg5!=null){
      if(d.sharesChg5>1)instS+=4;else if(d.sharesChg5>0)instS+=2;
    }
    if(d.prem!=null){
      const ap=Math.abs(d.prem);
      if(ap<=0.3)instS+=2;else if(ap<=0.6)instS+=1;
    }
    if(d.min?.dev!=null&&d.min.dev>0)instS+=1;
    d.instScore=instS;
    // 综合得分
    if(d.maScore!=null){
      d.score=(d.maScore||0)+(d.momScore||0)+(d.rsiScore||0)+(d.macdScore||0)+(d.flowScore||0)+(d.volScore||0)+(d.instScore||0);
    }
  }
  calcSenti();
}

// ── 市场情绪指数（自制恐贪 0-100）─────────────────────────────────────────
function calcSenti(){
  const allD=ETFS.map(e=>D[e.code]).filter(d=>d?.closes?.length>20);
  if(allD.length<10){MKT.senti=null;return;}
  MKT.breadth=Math.round(allD.filter(d=>d.price>d.ma20).length/allD.length*100);
  const rsis=allD.filter(d=>d.rsi!=null);
  MKT.avgRSI=rsis.length?Math.round(rsis.reduce((a,d)=>a+d.rsi,0)/rsis.length):null;
  MKT.macdBull=Math.round(allD.filter(d=>d.macd&&d.macd.dif>d.macd.dea).length/allD.length*100);
  let pos=50;
  const ic=MKT.k300?.closes,px=MKT.q['sh000300']?.price;
  if(ic?.length>=250){
    const w=ic.slice(-250),lo=Math.min(...w),hi=Math.max(...w);
    const p=px??ic[ic.length-1];
    if(hi>lo)pos=Math.max(0,Math.min(100,(p-lo)/(hi-lo)*100));
  }
  const volS=MKT.volRatio?Math.min(MKT.volRatio,1.5)/1.5*100:50;
  MKT.senti=Math.round(0.25*MKT.breadth+0.2*(MKT.avgRSI??50)+0.2*pos+0.15*volS+0.2*MKT.macdBull);
  const el=$('senti');
  if(el&&MKT.senti!=null){
    const s=MKT.senti;
    const lb=s<20?'😱极度恐慌':s<40?'😨恐慌':s<60?'😐中性':s<80?'🤑贪婪':'🔥极度贪婪';
    const bg=s<20?'#06b6d4':s<40?'#22c55e':s<60?'#5d6580':s<80?'#f59e0b':'#ef4444';
    el.textContent=`情绪${s} ${lb}`;
    el.style.background=bg+'22';el.style.color=bg;el.style.display='';
  }
}

async function loadAll(manual=false){
  const btn=$('rfb');
  btn.textContent='加载…';btn.disabled=true;
  ldDone=0;FAIL.clear();
  updateSt('获取实时价格…',false);
  renderSkel();

  const flowP=fetchFlow();                // 东财主力资金（需代理，可选）
  await fetchRT();
  compute();renderGrid();
  updateSt('加载历史K线…',false);
  const B=5;
  for(let i=0;i<ETFS.length;i+=B){
    await Promise.all(ETFS.slice(i,i+B).map(e=>
      fetchKline(e).then(()=>{
        ldDone++;$('prg').textContent=`${ldDone}/${ETFS.length}`;
        compute();renderGrid();
      })
    ));
  }

  sched();
}

// ── Render ────────────────────────────────────────────────────────────────
function getList(){
  if(curCat==='__ai')return[];
  let list;
  if(curCat==='all')list=[...ETFS];
  else if(curCat==='持仓')list=ETFS.filter(e=>POS.some(p=>p.code===e.code));
  else list=ETFS.filter(e=>e.cat===curCat);
  const sv=$('ss').value;
  list.sort((a,b)=>{
    const da=D[a.code]||{},db=D[b.code]||{};
    if(sv==='score')return(db.score??-1)-(da.score??-1);
    if(sv==='mom')  return(db.mom20??-999)-(da.mom20??-999);
    if(sv==='chg')  return(db.chg??-999)-(da.chg??-999);
    if(sv==='rsi')  return(db.rsi??-1)-(da.rsi??-1);
    return a.name.localeCompare(b.name,'zh');
  });
  return list;
}

function renderGrid(){

function cardOf(e){

  if(!d?.closes?.length){
    if(d?.price)return`<div class="card" onclick="openDet('${e.code}')">
      <div class="ccode">${e.code} · ${e.cat}</div>
      <div class="cname">${esc(e.name)}</div>
      <div class="cpx">${fP(d.price)}</div>
      <div class="cchg ${d.chg>0.01?'up':d.chg<-0.01?'dn':'fl'}">${fPct(d.chg)}</div>
      <div class="sk skh" style="width:70%;margin-top:8px"></div>
      <div class="sk skh"></div>
    </div>`;
    return`<div class="card"><div class="ccode">${e.code}</div><div class="cname">${esc(e.name)}</div>
      <div class="sk skp"></div><div class="sk skh" style="width:55%"></div><div class="sk skh"></div></div>`;
  }
  const sig=sigOf(d.score??0);
  const cc=d.chg>0.01?'up':d.chg<-0.01?'dn':'fl';
  const sc=d.score??0;
  const rz=rsiZone(d.rsi);
  const ma=[
    d.ma20&&d.price?`<span class="${d.price>d.ma20?'mu':'md'}">MA20${d.price>d.ma20?'▲':'▼'}</span>`:'',
    d.ma50&&d.price?`<span class="${d.price>d.ma50?'mu':'md'}">MA50${d.price>d.ma50?'▲':'▼'}</span>`:'',
    d.ma250&&d.price?`<span class="${d.price>d.ma250?'mu':'md'}">MA250${d.price>d.ma250?'▲':'▼'}</span>`:'',
  ].filter(Boolean).join(' ');
  // 资金流向小条
  const hasFlow=d.outVol!=null&&d.inVol!=null&&d.outVol+d.inVol>0;
  const flowPct=hasFlow?Math.round(d.outVol/(d.outVol+d.inVol)*100):null;
  const flowBar=hasFlow?`<div class="cflow on"><div class="cfl-in" style="width:${flowPct}%"></div></div>`:'<div class="cflow"></div>';
  // MACD方向
  const macdArrow=d.macd?(d.macd.dif>d.macd.dea?'<span style="color:var(--re);font-size:9px">▲MACD</span>':'<span style="color:var(--gr);font-size:9px">▼MACD</span>'):'';
  // 持仓盈亏行
  const pos=posOf(e.code);
  let posHtml='';
  if(pos&&d.price){
    const pct=(d.price-pos.cost)/pos.cost*100;
    const pnl=(d.price-pos.cost)*pos.shares;
    posHtml=`<div class="crow"><span class="cl">持仓盈亏</span><span class="cv" style="color:${pct>=0?'var(--re)':'var(--gr)'}">${fPct(pct)} ${pnl>=0?'+':''}${Math.round(pnl)}元</span></div>`;
  }
  // 机构动向徽章行：主力 / 份额5日 / 折溢价 / VWAP
  const ib=[];
  if(d.flow?.main!=null){
    const yi=d.flow.main/1e8;
    ib.push(`<span class="ibdg ${d.flow.main>0?'up':'dn'}">主力${d.flow.main>0?'+':''}${Math.abs(yi)>=1?yi.toFixed(1)+'亿':(d.flow.main/1e4).toFixed(0)+'万'}</span>`);
  }
  if(d.sharesChg5!=null&&Math.abs(d.sharesChg5)>=0.5)
    ib.push(`<span class="ibdg ${d.sharesChg5>0?'up':'dn'}">份额${d.sharesChg5>0?'+':''}${d.sharesChg5.toFixed(1)}%</span>`);
  if(d.prem!=null&&Math.abs(d.prem)>0.5)
    ib.push(`<span class="ibdg warn">${d.prem>0?'溢价':'折价'}${Math.abs(d.prem).toFixed(2)}%</span>`);
  if(d.min?.dev!=null&&Math.abs(d.min.dev)>=0.3)
    ib.push(`<span class="ibdg ${d.min.dev>0?'up':'dn'}">VW${d.min.dev>0?'+':''}${d.min.dev.toFixed(1)}%</span>`);
  if(d.obv?.div)
    ib.push(`<span class="ibdg warn">${d.obv.div}</span>`);
  const instHtml=ib.length?`<div class="cma" style="margin-top:1px">${ib.join(' ')}</div>`:'';
  return`<div class="card ${sig.c}" onclick="openDet('${e.code}')">
    <div class="csig">${sig.ico}</div>
    <div class="ccode">${e.code} · ${e.cat}${pos?' · 💼':''}</div>
    <div class="cname">${esc(e.name)}</div>
    <div class="cpxrow">
      <span class="cpx">${fP(d.price)}</span>
      ${d.rsi!=null?`<span class="crsi ${rz.cls}">RSI ${d.rsi.toFixed(0)}</span>`:''}
    </div>
    <div class="cchg ${cc}">${fPct(d.chg)}</div>
    <div class="cdiv"></div>
    <div class="crow"><span class="cl">20日动量</span><span class="cv">${fPct(d.mom20)}</span></div>
    <div class="crow"><span class="cl">5日动量</span><span class="cv">${fPct(d.mom5)}</span></div>
    <div class="crow"><span class="cl">动量排名</span><span class="cv">${d.rank?'#'+d.rank:'—'} ${macdArrow}</span></div>
    ${posHtml}
    ${instHtml}
    <div class="cma">${ma||'<span style="color:var(--t3)">均线计算中</span>'}</div>
    ${flowBar}
    ${hasFlow?`<div style="font-size:9px;color:${flowPct>55?'var(--re)':flowPct<45?'var(--gr)':'var(--t3)'}">外盘${flowPct}%</div>`:''}
    <div class="cbg"><div class="cb" style="width:${sc}%;background:${scc(sc)}"></div></div>
    <div class="csc" style="color:${scc(sc)}">得分 ${sc}</div>
  </div>`;
}

// ── Detail ────────────────────────────────────────────────────────────────
function openDet(code){
  const e=ETFS.find(x=>x.code===code);if(!e)return;
  const d=D[code]||{};
  $('dcode').textContent=code+' · '+e.cat;
  $('dname').textContent=e.name;
  $('dsig').textContent=d.score!=null?sigOf(d.score).ico:'—';
  $('dpx').textContent=fP(d.price);
  const ce=$('dchg');
  if(d.chg!=null){ce.textContent=fPct(d.chg);ce.className='dchg '+(d.chg>0.01?'up':d.chg<-0.01?'dn':'fl');}
  // 成交额
  $('damt').textContent=d.amount?`成交 ${fBig(d.amount)}`:'';
  // 持仓
  renderDPos(e,d);
  // MA tags
  const p=d.price||0;
  $('mtags').innerHTML=[
    d.ma20?`<span class="mtag ${p>d.ma20?'ab':'bel'}">MA20 ${fP(d.ma20)} ${p>d.ma20?'▲':'▼'}</span>`:'',
    d.ma50?`<span class="mtag ${p>d.ma50?'ab':'bel'}">MA50 ${fP(d.ma50)} ${p>d.ma50?'▲':'▼'}</span>`:'',
    d.ma250?`<span class="mtag ${p>d.ma250?'ab':'bel'}">MA250 ${fP(d.ma250)} ${p>d.ma250?'▲':'▼'}</span>`:'',
    d.bb?`<span class="mtag ${d.bb.pctB>0.8?'ab':d.bb.pctB<0.2?'bel':''}">BB%B ${(d.bb.pctB*100).toFixed(0)}%</span>`:'',
  ].join('');
  // RSI区域
  const rz=rsiZone(d.rsi);
  $('rsi-val').textContent=d.rsi!=null?d.rsi.toFixed(1):'—';
  $('rsi-val').style.color=rz.color;
  $('rsi-zone').textContent=rz.label;$('rsi-zone').style.color=rz.color;
  $('rsi-desc').textContent=rz.desc;
  $('rsi-label').textContent=`RSI(14)${d.rsi!=null?' · 超卖<30 超买>70':''}`;
  $('rsi-needle').style.left=(d.rsi!=null?Math.min(100,Math.max(0,d.rsi))+'%':'50%');
  // MACD
  const mc=d.macd;
  if(mc){
    const bull=mc.dif>mc.dea;
    const grow=mc.hist>mc.histPrev;
    const sigText=bull?(grow?'金叉扩张 🟢':'金叉收敛 🟡'):(grow?'死叉收窄 🟡':'死叉扩大 🔴');
    const badge=$('macd-sig-badge');
    badge.textContent=sigText;
    badge.className='macd-sig '+(bull?'macd-bull':'macd-bear');
    $('macd-vals').textContent=`DIF: ${mc.dif.toFixed(4)}  DEA: ${mc.dea.toFixed(4)}  柱: ${mc.hist.toFixed(4)}`;
    $('macd-desc').innerHTML=`${bull?'多头趋势':'空头趋势'}<br>${grow?'动能增强':'动能减弱'}`;
  }else{
    $('macd-sig-badge').textContent='数据不足';$('macd-sig-badge').className='macd-sig macd-neut';
    $('macd-vals').textContent='—';$('macd-desc').textContent='需≥35日数据';
  }
  // 技术指标网格
  const bbPctB=d.bb?(d.bb.pctB*100).toFixed(0)+'%':'—';
  const bbW=d.bb?d.bb.bandwidth.toFixed(1)+'%':'—';
  const kdjText=d.kdj?`K:${d.kdj.k.toFixed(0)} D:${d.kdj.d.toFixed(0)} J:${d.kdj.j.toFixed(0)}`:'—';
  const kdjColor=d.kdj?(d.kdj.j>80?'var(--re)':d.kdj.j<20?'var(--cy)':'var(--t2)'):'var(--t2)';
  const vrText=d.volRatio!=null?d.volRatio.toFixed(2)+'x':'—';
  const vrColor=d.volRatio!=null?(d.volRatio>2?'var(--re)':d.volRatio>1.3?'var(--ye)':'var(--t2)'):'var(--t2)';
  const turnText=d.turnover!=null?d.turnover.toFixed(2)+'%':'—';
  $('techgrid').innerHTML=`
    <div class="mc"><div class="ml">BB上轨</div><div class="mv" style="font-size:11px">${d.bb?fP(d.bb.upper):'—'}</div></div>
    <div class="mc"><div class="ml">BB中轨</div><div class="mv" style="font-size:11px">${d.bb?fP(d.bb.middle):'—'}</div></div>
    <div class="mc"><div class="ml">BB下轨</div><div class="mv" style="font-size:11px">${d.bb?fP(d.bb.lower):'—'}</div></div>
    <div class="mc"><div class="ml">BB宽度</div><div class="mv" style="font-size:11px">${bbW}</div></div>
    <div class="mc"><div class="ml">KDJ</div><div class="mv" style="font-size:10px;color:${kdjColor}">${kdjText}</div></div>
    <div class="mc"><div class="ml">量比</div><div class="mv" style="color:${vrColor}">${vrText}</div></div>
    <div class="mc"><div class="ml">换手率</div><div class="mv" style="font-size:11px">${turnText}</div></div>
    <div class="mc"><div class="ml">日内振幅</div><div class="mv" style="font-size:11px">${(d.hi&&d.lo)?((d.hi-d.lo)/d.lo*100).toFixed(2)+'%':'—'}</div></div>
  `;
  // 量化因子
  const adxTxt=d.adx?`${d.adx.adx.toFixed(0)}${d.adx.adx>25?' 强':d.adx.adx>20?' 中':' 弱'}`:'—';
  const adxCol=d.adx?(d.adx.pdi>d.adx.ndi?'var(--re)':'var(--gr)'):'var(--t2)';
  const diTxt=d.adx?`+DI${d.adx.pdi.toFixed(0)} -DI${d.adx.ndi.toFixed(0)}`:'—';
  $('quantgrid').innerHTML=`
    <div class="mc"><div class="ml">ADX趋势</div><div class="mv" style="color:${adxCol}">${adxTxt}</div></div>
    <div class="mc"><div class="ml">DI方向</div><div class="mv" style="font-size:10px">${diTxt}</div></div>
    <div class="mc"><div class="ml">BIAS20</div><div class="mv" style="font-size:12px;color:${d.bias20!=null&&Math.abs(d.bias20)>6?'var(--ye)':'var(--tx)'}">${d.bias20!=null?fPct(d.bias20):'—'}</div></div>
    <div class="mc"><div class="ml">ATR14</div><div class="mv" style="font-size:12px">${d.atr?fP(d.atr):'—'}</div></div>
    <div class="mc"><div class="ml">Beta60</div><div class="mv" style="font-size:12px">${d.beta!=null?d.beta.toFixed(2):'—'}</div></div>
    <div class="mc"><div class="ml">相对强度RS</div><div class="mv" style="font-size:12px;color:${d.rs20!=null?(d.rs20>0?'var(--re)':'var(--gr)'):'var(--tx)'}">${d.rs20!=null?fPct(d.rs20):'—'}</div></div>
    <div class="mc"><div class="ml">波动比20/60</div><div class="mv" style="font-size:12px;color:${d.volR!=null&&d.volR>1.3?'var(--ye)':'var(--tx)'}">${d.volR!=null?d.volR.toFixed(2):'—'}</div></div>
    <div class="mc"><div class="ml">OBV量价</div><div class="mv" style="font-size:11px;color:${d.obv?.div?'var(--ye)':'var(--tx)'}">${d.obv?.div??(d.obv?'同步':'—')}</div></div>
  `;
  // 机构动向
  renderInst(code,d);
  // 支撑阻力
  renderSR(d);
  // 交易时段按需加载分时VWAP
  if(isTrade()&&(!d.min||Date.now()-d.min.t>180000)){
    fetchMinute(code).then(()=>{if($('det').classList.contains('show'))renderInst(code,D[code]||d);});
  }
  // 资金流向（主力 + 内外盘）
  renderMainFlow(e,d);
  const hasFlow=d.outVol!=null&&d.inVol!=null&&d.outVol+d.inVol>0;
  if(hasFlow){
    const tot=d.outVol+d.inVol;
    const inPct=Math.round(d.outVol/tot*100);
    const outPct=100-inPct;
    const bias=inPct>55?'资金净流入 ✅':inPct<45?'资金净流出 ⚠️':'资金中性 ↔';
    $('flow-title').textContent=bias+` · 今日外盘率 ${inPct}%`;
    $('flow-in').style.width=inPct+'%';
    $('flow-in').textContent=inPct>25?inPct+'%':'';
    $('flow-out').style.width=outPct+'%';
    $('flow-out').textContent=outPct>25?outPct+'%':'';
    $('flow-stats').innerHTML=`<span>外盘（主买）${(d.outVol/100).toFixed(0)}万手</span><span>内盘（主卖）${(d.inVol/100).toFixed(0)}万手</span>`;
  }else{
    $('flow-title').textContent='暂无资金流向数据（非交易时段）';
    $('flow-in').style.width='50%';$('flow-in').textContent='';
    $('flow-out').style.width='50%';$('flow-out').textContent='';
    $('flow-stats').innerHTML='<span>外盘（主买）</span><span>内盘（主卖）</span>';
  }
  // 得分解析（七维）
  const sc=d.score??0,tot2=ETFS.filter(e=>D[e.code]?.mom20!=null).length;
  const maRows=[
    d.ma20&&p?`<div>${p>d.ma20?'✅':'❌'} MA20 ${fP(d.ma20)}：${p>d.ma20?'+8':'0'}</div>`:'',
    d.ma50&&p?`<div>${p>d.ma50?'✅':'❌'} MA50 ${fP(d.ma50)}：${p>d.ma50?'+7':'0'}</div>`:'',
    d.ma250&&p?`<div>${p>d.ma250?'✅':'❌'} MA250 ${fP(d.ma250)}：${p>d.ma250?'+5':'0'}</div>`:'',
    d.adx?`<div>${d.adx.adx>20&&d.adx.pdi>d.adx.ndi?'✅':'❌'} ADX ${d.adx.adx.toFixed(0)}（+DI${d.adx.pdi.toFixed(0)}/-DI${d.adx.ndi.toFixed(0)}）：${d.adx.adx>20&&d.adx.pdi>d.adx.ndi?'+5':'0'}</div>`:'',
  ].join('');
  const rsiDesc=d.rsi!=null?`RSI ${d.rsi.toFixed(1)} → `+
    (d.rsi>=45&&d.rsi<=65?'+15（最优区间）':
     (d.rsi>=35&&d.rsi<45)||(d.rsi>65&&d.rsi<=72)?'+9（次优区间）':
     d.rsi<35?'+6（超卖关注）':d.rsi<=80?'+3（超买谨慎）':'+0（极度超买）'):'数据不足';
  const macdDescFull=mc?(`DIF${mc.dif>mc.dea?'>':'<'}DEA, 柱${mc.hist>0?'正':'负'}${mc.hist>mc.histPrev?'扩':'缩'} → +${d.macdScore??0}`):'数据不足';
  const flowDescFull=hasFlow?
    `外盘率${Math.round(d.outVol/(d.outVol+d.inVol)*100)}% → +${d.flowScore??0}`:'无数据 → +0';
  const volDesc=`量比${d.volRatio!=null?d.volRatio.toFixed(2)+'x':'—'} · 量能温度${d.volT!=null?d.volT.toFixed(2):'—'} → +${d.volScore??0}`;
  const instParts=[];
  if(d.flow?.mainPct!=null)instParts.push(`主力${fPct(d.flow.mainPct)}`);
  if(d.sharesChg5!=null)instParts.push(`份额5日${fPct(d.sharesChg5)}`);
  if(d.prem!=null)instParts.push(`溢价${fPct(d.prem)}`);
  if(d.min?.dev!=null)instParts.push(`VWAP${fPct(d.min.dev)}`);
  const instDesc=instParts.length?`${instParts.join(' · ')} → +${d.instScore??0}`:'无数据（配置东财代理解锁主力资金）→ +0';
  $('scoreExp').innerHTML=`
    <div style="font-size:12px;font-weight:700;color:var(--tx);margin-bottom:8px">📊 七维评分解析</div>
    <div style="margin-bottom:7px"><div style="color:var(--t3);font-size:10px;margin-bottom:2px">① 趋势排列 + ADX（max 25）</div>${maRows||'—'}<div style="color:var(--bl);font-weight:600">小计：${d.maScore??0} / 25</div></div>
    <div style="margin-bottom:7px"><div style="color:var(--t3);font-size:10px;margin-bottom:2px">② 20日动量排名（max 15）</div><div>在${tot2}只中排名 #${d.rank??'—'} → +${d.momScore??0}</div><div style="color:var(--bl);font-weight:600">小计：${d.momScore??0} / 15</div></div>
    <div style="margin-bottom:7px"><div style="color:var(--t3);font-size:10px;margin-bottom:2px">③ RSI强弱（max 15）</div><div>${rsiDesc}</div><div style="color:var(--bl);font-weight:600">小计：${d.rsiScore??0} / 15</div></div>
    <div style="margin-bottom:7px"><div style="color:var(--t3);font-size:10px;margin-bottom:2px">④ MACD趋势（max 10）</div><div>${macdDescFull}</div><div style="color:var(--bl);font-weight:600">小计：${d.macdScore??0} / 10</div></div>
    <div style="margin-bottom:7px"><div style="color:var(--t3);font-size:10px;margin-bottom:2px">⑤ 内外盘（max 10）</div><div>${flowDescFull}</div><div style="color:var(--bl);font-weight:600">小计：${d.flowScore??0} / 10</div></div>
    <div style="margin-bottom:7px"><div style="color:var(--t3);font-size:10px;margin-bottom:2px">⑥ 量能（max 10）</div><div>${volDesc}</div><div style="color:var(--bl);font-weight:600">小计：${d.volScore??0} / 10</div></div>
    <div style="margin-bottom:8px"><div style="color:var(--t3);font-size:10px;margin-bottom:2px">⑦ 资金动向·主力/份额/溢价/VWAP（max 15）</div><div>${instDesc}</div><div style="color:var(--bl);font-weight:600">小计：${d.instScore??0} / 15</div></div>
    <div style="border-top:1px solid var(--s3);padding-top:7px">
      <span style="font-size:14px;font-weight:700;color:${scc(sc)}">综合 ${sc} / 100 ${sc>=70?'🟢 买入信号':sc>=40?'🟡 持续观望':'🔴 回避风险'}</span>
      <div style="color:var(--t3);font-size:10px;margin-top:3px">历史 ${d.closes?.length??0} 日 · 趋势25+动量15+RSI15+MACD10+内外盘10+量能10+资金15</div>
    </div>`;
  // 市场位置
  const dh=d.high250&&p?(p-d.high250)/d.high250*100:null;
  const dhCol=dh!=null?(dh<-15?'var(--gr)':dh>-3?'var(--re)':'var(--t2)'):'var(--t2)';
  $('mgrid2').innerHTML=`
    <div class="mc"><div class="ml">250日高点</div><div class="mv" style="font-size:11px">${d.high250?fP(d.high250):'—'}</div></div>
    <div class="mc"><div class="ml">距高点</div><div class="mv" style="color:${dhCol};font-size:12px">${dh!=null?dh.toFixed(1)+'%':'—'}</div></div>
    <div class="mc"><div class="ml">20日波动率</div><div class="mv" style="font-size:11px">${d.vol20!=null?d.vol20.toFixed(1)+'%':'—'}</div></div>
  `;
  $('det').classList.add('show');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    drawChart(d);
    drawMACD(d);
  }));
}
function closeDet(){$('det').classList.remove('show');}

// ── 机构动向区（份额申赎/折溢价/VWAP/尾盘）────────────────────────────────
function renderInst(code,d){
  const g=$('instgrid');if(!g)return;
  const shYi=d.shares?(d.shares/1e8).toFixed(1)+'亿份':'—';
  const c1=d.sharesChg1!=null?fPct(d.sharesChg1):'—';
  const c5=d.sharesChg5!=null?fPct(d.sharesChg5):'—';
  const shCol=v=>v==null?'var(--tx)':v>0?'var(--bl)':'var(--t3)';
  const pmCol=d.prem==null?'var(--tx)':Math.abs(d.prem)<=0.3?'var(--tx)':'var(--ye)';
  const vwTxt=d.min?.vwap?fP(d.min.vwap):'—';
  const dvTxt=d.min?.dev!=null?fPct(d.min.dev):'—';
  const dvCol=d.min?.dev!=null?(d.min.dev>0?'var(--re)':'var(--gr)'):'var(--tx)';
  g.innerHTML=`
    <div class="mc"><div class="ml">基金份额</div><div class="mv" style="font-size:12px">${shYi}</div></div>
    <div class="mc"><div class="ml">份额1日</div><div class="mv" style="font-size:12px;color:${shCol(d.sharesChg1)}">${c1}</div></div>
    <div class="mc"><div class="ml">份额5日</div><div class="mv" style="font-size:12px;color:${shCol(d.sharesChg5)}">${c5}</div></div>
    <div class="mc"><div class="ml">折溢价</div><div class="mv" style="font-size:12px;color:${pmCol}">${d.prem!=null?fPct(d.prem):'—'}</div></div>
    <div class="mc"><div class="ml">IOPV净值</div><div class="mv" style="font-size:12px">${d.iopv?fP(d.iopv):'—'}</div></div>
    <div class="mc"><div class="ml">VWAP</div><div class="mv" style="font-size:12px">${vwTxt}</div></div>
    <div class="mc"><div class="ml">偏离VWAP</div><div class="mv" style="font-size:12px;color:${dvCol}">${dvTxt}</div></div>
    <div class="mc"><div class="ml">尾盘量占比</div><div class="mv" style="font-size:12px">${d.min?.tailPct!=null?d.min.tailPct.toFixed(0)+'%':'—'}</div></div>
  `;
  const notes=[];
  if(d.sharesChg5!=null)notes.push(d.sharesChg5>1?'📈 份额持续增加=资金净申购，机构在吸货':d.sharesChg5<-1?'📉 份额持续减少=净赎回，资金在撤离':'份额平稳，申赎均衡');
  if(d.prem!=null&&Math.abs(d.prem)>0.5)notes.push(d.prem>0.5?'⚠️ 溢价偏高：买入多付溢价，警惕情绪过热':'💡 折价偏大：恐慌抛售或套利机会');
  if(d.min?.dev!=null&&Math.abs(d.min.dev)>=0.5)notes.push(d.min.dev>0?'现价强于VWAP：全天买方积极':'现价弱于VWAP：全天卖方压制');
  if(d.min?.tailPct!=null)notes.push(`尾盘30分钟成交占${d.min.tailPct.toFixed(0)}%${d.min.tailPct>25?'，尾盘异动明显':''}`);
  $('instnote').innerHTML=notes.length?notes.join('<br>'):(localStorage.getItem('emProxy')?'':'份额/折溢价数据就绪；主力资金流需在 ⚙️ 配置东财代理后解锁');
}

// ── 支撑阻力位 ────────────────────────────────────────────────────────────
function renderSR(d){
  const el=$('srrow');if(!el)return;
  const p=d.price;
  if(!p){el.textContent='—';return;}
  const sup=[],res=[];
  const pushS=(v,t)=>{if(v&&v<p)sup.push({v,t});};
  const pushR=(v,t)=>{if(v&&v>p)res.push({v,t});};
  pushS(d.ma20,'MA20');pushS(d.ma50,'MA50');pushS(d.ma250,'MA250');
  pushS(d.bb?.lower,'BB下轨');pushS(d.low250,'前低');
  if(d.atr)pushS(p-1.5*d.atr,'1.5ATR');
  pushR(d.ma20,'MA20');pushR(d.ma50,'MA50');
  pushR(d.bb?.upper,'BB上轨');pushR(d.high250,'前高');
  if(d.atr)pushR(p+1.5*d.atr,'1.5ATR');
  sup.sort((a,b)=>b.v-a.v);res.sort((a,b)=>a.v-b.v);
  const fmt=a=>a.slice(0,2).map(x=>`<span style="color:var(--tx);font-weight:600">${fP(x.v)}</span> <span style="color:var(--t3);font-size:10px">${x.t}</span>`).join('　');
  el.innerHTML=`<div>🟢 支撑：${fmt(sup)||'—'}</div><div>🔴 阻力：${fmt(res)||'—'}</div>${d.atr?`<div style="color:var(--t3);font-size:10px">ATR止损参考：宽 ${fP(p-2.5*d.atr)}（-2.5ATR）/ 窄 ${fP(p-1.5*d.atr)}（-1.5ATR）</div>`:''}`;
}

// ── 主力资金四档（东财，需代理）──────────────────────────────────────────
function renderMainFlow(e,d){

  const mx=Math.max(...rows.map(r=>Math.abs(r[1]||0)),1);

      ${rows.map(([nm,v])=>{if(v==null)return'';const w=Math.abs(v)/mx*100;

          <div style="flex:1;height:8px;background:var(--s3);border-radius:4px;overflow:hidden">
            <div style="height:100%;width:${w}%;background:${v>0?'var(--re)':'var(--gr)'};border-radius:4px"></div>
          </div>
          <span style="font-size:10px;color:${v>0?'var(--re)':'var(--gr)'};width:58px;text-align:right;flex-shrink:0">${v>0?'+':''}${yi(v)}</span>
        </div>`;}).join('')}

// ── 主图表（价格+量+布林带）─────────────────────────────────────────────
function drawChart(d){
  const cv=$('ch'),ctx=cv.getContext('2d');
  const dpr=devicePixelRatio||1,W=cv.offsetWidth;
  const H_price=140,H_vol=45,H=H_price+H_vol;
  cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  if(!d.closes||d.closes.length<2)return;
  const N=120;
  const cls=d.closes.slice(-N);
  const his=d.highs?d.highs.slice(-N):cls;
  const los=d.lows?d.lows.slice(-N):cls;
  const vols=d.volumes?d.volumes.slice(-N):null;
  const n=cls.length;
  const px=i=>i/(n-1)*W;
  // 滚动布林带
  const bbArr=rollingBB(d.closes,N);
  // Y范围（包含BB）
  const allVals=[...cls];
  bbArr.forEach(b=>{if(b){allVals.push(b.upper,b.lower);}});
  const mn=Math.min(...allVals),mx=Math.max(...allVals),rng=mx-mn||1;
  const py=v=>(1-(v-mn)/rng)*(H_price-18)+9;
  // 成交量区域背景
  ctx.fillStyle='rgba(46,52,72,.3)';
  ctx.fillRect(0,H_price,W,H_vol);
  ctx.strokeStyle='rgba(93,101,128,0.3)';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(0,H_price);ctx.lineTo(W,H_price);ctx.stroke();
  // 成交量柱
  if(vols&&vols.some(v=>v>0)){
    const maxVol=Math.max(...vols.filter(v=>v>0));
    vols.forEach((v,i)=>{
      if(!v)return;
      const bh=Math.max(2,(v/maxVol)*(H_vol-6));
      const bw=Math.max(1,W/n-0.5);
      const up=i===0||cls[i]>=cls[i-1];
      ctx.fillStyle=up?'rgba(239,68,68,0.4)':'rgba(34,197,94,0.4)';
      ctx.fillRect(px(i)-bw/2,H_price+H_vol-bh-2,bw,bh);
    });
  }
  // 布林带填充
  const bbPts=bbArr.map((b,i)=>b?{i,upper:b.upper,lower:b.lower}:null).filter(Boolean);
  if(bbPts.length>=2){
    ctx.beginPath();
    bbPts.forEach(({i,upper},j)=>j?ctx.lineTo(px(i),py(upper)):ctx.moveTo(px(i),py(upper)));
    bbPts.slice().reverse().forEach(({i,lower})=>ctx.lineTo(px(i),py(lower)));
    ctx.closePath();ctx.fillStyle='rgba(99,102,241,0.07)';ctx.fill();
    // 上轨线
    ctx.beginPath();ctx.strokeStyle='rgba(99,102,241,0.35)';ctx.lineWidth=1;ctx.setLineDash([2,4]);
    bbPts.forEach(({i,upper},j)=>j?ctx.lineTo(px(i),py(upper)):ctx.moveTo(px(i),py(upper)));
    ctx.stroke();
    // 下轨线
    ctx.beginPath();
    bbPts.forEach(({i,lower},j)=>j?ctx.lineTo(px(i),py(lower)):ctx.moveTo(px(i),py(lower)));
    ctx.stroke();ctx.setLineDash([]);
    // 中轨
    ctx.beginPath();ctx.strokeStyle='rgba(99,102,241,0.2)';ctx.lineWidth=0.8;
    bbPts.forEach(({i},j)=>{
      const mid=(bbArr[i].upper+bbArr[i].lower)/2;
      j?ctx.lineTo(px(i),py(mid)):ctx.moveTo(px(i),py(mid));
    });
    ctx.stroke();
  }
  // MA线
  const dma=(per,col)=>{
    const pts=[];
    for(let i=per-1;i<cls.length;i++){
      const sl=cls.slice(i-per+1,i+1);
      pts.push([i,sl.reduce((a,b)=>a+b,0)/per]);
    }
    if(pts.length<2)return;
    ctx.beginPath();ctx.strokeStyle=col;ctx.lineWidth=1;ctx.setLineDash([3,3]);
    pts.forEach(([i,v],j)=>j?ctx.lineTo(px(i),py(v)):ctx.moveTo(px(i),py(v)));
    ctx.stroke();ctx.setLineDash([]);
  };
  dma(20,'#6366f1');dma(50,'#f59e0b');
  // 价格线
  const up=cls[n-1]>=cls[0];
  const g=ctx.createLinearGradient(0,0,0,H_price);
  g.addColorStop(0,up?'#ef444428':'#22c55e28');g.addColorStop(1,'transparent');
  ctx.beginPath();
  cls.forEach((v,i)=>i?ctx.lineTo(px(i),py(v)):ctx.moveTo(px(i),py(v)));
  ctx.lineTo(px(n-1),H_price);ctx.lineTo(0,H_price);
  ctx.closePath();ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.strokeStyle=up?'var(--re)':'var(--gr)';ctx.lineWidth=2;
  cls.forEach((v,i)=>i?ctx.lineTo(px(i),py(v)):ctx.moveTo(px(i),py(v)));
  ctx.stroke();
  // 标签
  ctx.setTransform(1,0,0,1,0,0);
  ctx.font='10px sans-serif';
  ctx.fillStyle='#6366f1';ctx.fillText('MA20',4,13);
  ctx.fillStyle='#f59e0b';ctx.fillText('MA50',44,13);
  ctx.fillStyle='rgba(99,102,241,0.6)';ctx.fillText('BB',82,13);
  ctx.fillStyle='rgba(148,163,184,.55)';ctx.textAlign='right';
  ctx.fillText(fP(mx),W-3,12);ctx.fillText(fP(mn),W-3,H_price-3);
  ctx.fillStyle='rgba(148,163,184,.4)';ctx.font='9px sans-serif';
  ctx.fillText('VOL',W-3,H_price+14);
  ctx.textAlign='left';
}

// ── MACD 柱状图 ───────────────────────────────────────────────────────────
function drawMACD(d){
  const cv=$('macd-cv'),ctx=cv.getContext('2d');
  const dpr=devicePixelRatio||1,W=cv.offsetWidth,H=40;
  cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  if(!d.macd?.histArr?.length)return;
  const hists=d.macd.histArr;
  const n=hists.length;
  const mx=Math.max(...hists.map(Math.abs))||1;
  const midY=H/2;
  const px=i=>(i/(n-1))*W;
  const py=v=>midY-v/mx*midY*0.88;
  // 零轴
  ctx.strokeStyle='rgba(93,101,128,0.4)';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(0,midY);ctx.lineTo(W,midY);ctx.stroke();
  // 柱子
  const bw=Math.max(1,W/n-0.5);
  hists.forEach((v,i)=>{
    const col=v>=0?
      (i>0&&v>hists[i-1]?'rgba(239,68,68,0.8)':'rgba(239,68,68,0.4)'):
      (i>0&&v<hists[i-1]?'rgba(34,197,94,0.8)':'rgba(34,197,94,0.4)');
    ctx.fillStyle=col;
    const y=py(v),h=Math.abs(midY-y);
    ctx.fillRect(px(i)-bw/2,Math.min(y,midY),bw,Math.max(1,h));
  });
}

function saveCfg(){

// ── 持仓管理 ──────────────────────────────────────────────────────────────
const posOf=c=>POS.find(p=>p.code===c);
function persistPos(){localStorage.setItem('etfPos',JSON.stringify(POS));}
function openPos(code){
  renderPosList();
  if(code)fillPos(code);
  else{$('pcost').value='';$('pshares').value='';}
  $('posm').classList.add('show');
}
function closePos(){$('posm').classList.remove('show');}
function fillPos(code){
  $('pcode').value=code;
  const p=posOf(code);
  $('pcost').value=p?p.cost:'';
  $('pshares').value=p?p.shares:'';
}
function savePos(){
  const code=$('pcode').value;
  const cost=parseFloat($('pcost').value),shares=parseFloat($('pshares').value);
  if(!(cost>0)||!(shares>0)){toast('请填写有效的成本价和份额');return;}
  const ex=posOf(code);
  if(ex){ex.cost=cost;ex.shares=shares;}else POS.push({code,cost,shares});
  persistPos();renderPosList();renderGrid();
  if($('det').classList.contains('show'))renderDPos(ETFS.find(x=>x.code===code),D[code]||{});
  // 清空表单，方便继续添加下一只
  $('pcost').value='';$('pshares').value='';
  toast(ex?'✓ 已更新':'✓ 已添加，可继续选下一只');
}
function delPos(code){
  POS=POS.filter(p=>p.code!==code);
  persistPos();renderPosList();renderGrid();
  if($('det').classList.contains('show'))renderDPos(ETFS.find(x=>x.code===code),D[code]||{});
  toast('已删除');
}
function renderPosList(){
  const el=$('poslist');
  if(!POS.length){el.innerHTML='<div style="font-size:12px;color:var(--t3);text-align:center;padding:6px 0 10px">暂无持仓，在下方添加</div>';return;}
  el.innerHTML=POS.map(p=>{
    const e=ETFS.find(x=>x.code===p.code);if(!e)return'';
    const px=D[p.code]?.price;
    const pnlHtml=px?`<span style="color:${px>=p.cost?'var(--re)':'var(--gr)'}">${fPct((px-p.cost)/p.cost*100)}</span>`:'';
    return`<div class="prow" onclick="fillPos('${p.code}')">
      <div style="flex:1"><div class="prname">${esc(e.name)}</div>
      <div class="prsub">${fP(p.cost)} × ${p.shares}份 ${pnlHtml}</div></div>
      <button class="prdel" onclick="delPos('${p.code}');event.stopPropagation()">🗑</button>
    </div>`;
  }).join('');
}
function renderDPos(e,d){
  const el=$('dpos'),pos=posOf(e.code);
  if(!pos){el.innerHTML=`<button class="padd" onclick="openPos('${e.code}')">＋ 添加持仓，获取割/拿/补建议</button>`;return;}
  const px=d.price||d.closes?.[d.closes.length-1]||pos.cost;
  const pnl=(px-pos.cost)*pos.shares,pct=(px-pos.cost)/pos.cost*100,mv=px*pos.shares;
  const col=pnl>=0?'var(--re)':'var(--gr)';
  el.innerHTML=`<div class="dcard">
    <div class="pcrow"><span class="pl">成本 ${fP(pos.cost)} × ${pos.shares}份</span><span class="pv">市值 ${fBig(mv)}</span></div>
    <div class="pcrow"><span class="pl">持仓盈亏</span><span class="pv" style="color:${col};font-size:15px;font-weight:700">${pnl>=0?'+':''}${Math.round(pnl)}元 (${fPct(pct)})</span></div>
    <div class="pbtns">
      <button class="pbtn ai" onclick="aiAdvice('${e.code}')">🤖 AI操作建议</button>
      <button class="pbtn" onclick="openPos('${e.code}')">✏️ 编辑持仓</button>
    </div>
  </div>`;
}
